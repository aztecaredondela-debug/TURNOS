<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turnos - Mantenimiento</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Turnos">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
<div id="errBar" hidden></div>
<script>
  // Muestra cualquier fallo en pantalla (incluidos los de carga del módulo)
  function mostrarError(m){var b=document.getElementById("errBar");if(b){b.textContent="⚠️ "+m+" (toca para cerrar)";b.hidden=false;b.onclick=function(){b.hidden=true;};}}
  window.addEventListener("error",function(e){mostrarError(e.message||"Error al cargar la aplicación");});
  window.addEventListener("unhandledrejection",function(e){mostrarError("No se pudo guardar: "+((e.reason&&e.reason.message)||e.reason));});
</script>
<div class="app-container"><div class="card">
  <h1>Mantenimiento</h1>

  <div id="codigoArea" hidden>
    <label for="codigo">Código del equipo</label>
    <input id="codigo" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
    <p class="ayuda">Pídeselo a tu responsable. Solo hace falta la primera vez en cada móvil.</p>
    <div id="codigoMsg" class="msg"></div>
    <button class="btn-sync" id="btnCodigo">Continuar</button>
  </div>

  <div id="loginArea" hidden>
    <label for="selOp">¿Quién eres?</label>
    <select id="selOp"></select>
    <div id="nuevoArea" hidden>
      <label for="nuevoNombre">Tu nombre</label>
      <input id="nuevoNombre" maxlength="30" autocomplete="off">
      <label for="grupoSel">Tu grupo</label>
      <select id="grupoSel"></select>
      <label for="tipoTurno">Tu turno</label>
      <select id="tipoTurno"></select>
      <div id="rotArea">
        <label for="fechaBase">Fecha de referencia</label>
        <input type="date" id="fechaBase">
        <label for="turnoBase">Tu turno ese día</label>
        <select id="turnoBase"></select>
      </div>
      <div id="mtArea" hidden>
        <label for="mtSemana">Esta semana trabajo de</label>
        <select id="mtSemana"></select>
        <p class="ayuda">Si hoy es fin de semana, elige la semana que acaba de terminar.</p>
      </div>
    </div>
    <label for="pin">PIN (4 cifras)</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
    <div id="loginMsg" class="msg"></div>
    <button class="btn-sync" id="btnEntrar">Entrar</button>
  </div>

  <div id="mainArea" hidden>
    <div class="who"><b id="quien"></b><button id="btnSalir" class="link">Salir</button></div>
    <div class="tabs">
      <button data-tab="cal" class="on">Calendario</button>
      <button data-tab="quien">👥 Quién</button>
      <button data-tab="chat">💬 Chat <span id="badgeChat"></span></button>
      <button data-tab="sol">Solicitudes <span id="badge"></span></button>
      <button data-tab="aus">Ausencias</button>
      <button data-tab="eq" id="tabEq" hidden>Equipo</button>
      <button data-tab="fest" id="tabFest" hidden>🎉 Festivos</button>
    </div>
    <div id="viewCal">
      <div class="cal-header">
        <button class="nav-btn" id="prev" aria-label="Mes anterior">❮</button>
        <div id="monthLabel"></div>
        <button class="nav-btn" id="next" aria-label="Mes siguiente">❯</button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="fest-mes" id="festMes" hidden></div>
    </div>
    <div id="viewQuien" hidden>
      <div class="cal-header">
        <button class="nav-btn" id="qPrev" aria-label="Día anterior">❮</button>
        <div id="qLabel"></div>
        <button class="nav-btn" id="qNext" aria-label="Día siguiente">❯</button>
      </div>
      <input type="date" id="qFecha" aria-label="Ir a una fecha">
      <select id="qGrupo" aria-label="Filtrar por grupo"></select>
      <button class="btn-sec" id="qHoy" hidden>Volver a hoy</button>
      <div id="listaQuien"></div>
      <label>Días siguientes</label>
      <div id="proxQuien"></div>
    </div>
    <div id="viewChat" hidden>
      <div id="chatMsgs"></div>
      <div class="chat-form">
        <input id="chatTxt" maxlength="500" placeholder="Escribe un mensaje..." autocomplete="off" aria-label="Mensaje">
        <button class="btn-chat" id="chatEnviar">Enviar</button>
      </div>
    </div>
    <div id="viewSol" hidden></div>
    <div id="viewAus" hidden>
      <label for="ausAnio">Mis días registrados · año</label>
      <select id="ausAnio"></select>
      <div id="resumenAus"></div>
      <label for="ausTipo" style="margin-top:18px">Registrar mi ausencia</label>
      <select id="ausTipo"></select>
      <label for="ausDesde">Desde</label><input type="date" id="ausDesde">
      <label for="ausHasta">Hasta</label><input type="date" id="ausHasta">
      <button class="btn-sync" id="btnAus">Registrar</button>
      <div id="listaAus"></div>
      <div id="resumenEquipo"></div>
    </div>
    <div id="viewEq" hidden></div>
    <div id="viewFest" hidden>
      <label for="festAnio">Año</label>
      <select id="festAnio"></select>
      <label for="festFecha">Añadir un festivo</label>
      <input type="date" id="festFecha">
      <label for="festTexto">Texto (opcional)</label>
      <input id="festTexto" maxlength="40" placeholder="F" autocomplete="off">
      <button class="btn-sync" id="btnFest">Añadir festivo</button>
      <div id="listaFest"></div>
    </div>
  </div>
</div></div>
<div id="ver"></div>

<div id="modal" class="modal" hidden><div class="modal-body" id="modalBody"></div></div>
<script type="module" src="app.js?v=13"></script>
</body>
</html>
