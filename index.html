<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Turnos - Mantenimiento</title>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<div id="errBar" hidden></div>
<script>
  // Muestra cualquier fallo en pantalla (incluidos los de carga del módulo)
  function mostrarError(m){var b=document.getElementById("errBar");if(b){b.textContent="⚠️ "+m+" (toca para cerrar)";b.hidden=false;b.onclick=function(){b.hidden=true;};}}
  window.addEventListener("error",function(e){mostrarError(e.message||"Error al cargar la aplicación");});
  window.addEventListener("unhandledrejection",function(e){mostrarError("No se pudo guardar: "+((e.reason&&e.reason.message)||e.reason));});
</script>

<div class="app-container">
  <div id="loginArea" class="login">
    <header class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M8 15l3 3 5-5"/></svg></div>
      <h1>Turnos</h1>
      <p>Mantenimiento</p>
    </header>
    <div class="card">
      <label for="selOp">¿Quién eres?</label>
      <select id="selOp"></select>
      <div id="nuevoArea" hidden>
        <label for="nuevoNombre">Tu nombre</label>
        <input id="nuevoNombre" maxlength="30" autocomplete="off">
        <label for="tipoHor">Tu horario</label>
        <select id="tipoHor"><option value="">Turnos rotativos (ciclo)</option><option value="M">Fijo mañana (L-V)</option><option value="T">Fijo tarde (L-V)</option><option value="S">Una semana mañana y otra tarde (L-V)</option></select>
        <div id="rotArea">
          <label for="fechaBase">Fecha de referencia</label>
          <input type="date" id="fechaBase">
          <div id="cicloSel">
            <label for="turnoBase">Tu turno ese día</label>
            <select id="turnoBase"></select>
          </div>
          <div id="semSel" hidden>
            <label for="semBase">Esa semana estás de</label>
            <select id="semBase"><option value="0">Mañana</option><option value="1">Tarde</option></select>
          </div>
        </div>
      </div>
      <label for="pin">PIN (4 cifras)</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
      <div id="loginMsg" class="msg"></div>
      <button class="btn-sync" id="btnEntrar">Entrar</button>
    </div>
  </div>

  <div id="mainArea" hidden>
    <div class="who">
      <div class="avatar" id="avatar"></div>
      <div class="who-txt"><small>Sesión iniciada</small><b id="quien"></b></div>
      <button id="btnSalir" class="link">Salir</button>
    </div>

    <main>
      <div id="viewCal">
        <div id="hoyCard" class="hoy"></div>
        <div class="cal-card">
          <div class="cal-header">
            <button class="nav-btn" id="prev" aria-label="Mes anterior">‹</button>
            <div id="monthLabel"></div>
            <button class="nav-btn" id="next" aria-label="Mes siguiente">›</button>
          </div>
          <div class="grid" id="grid"></div>
          <div class="leyenda"><span><i class="dot f"></i>Festivo</span><span><i class="dot cv"></i>Convenio</span><span><i class="dot nt"></i>Nota</span><span><i class="dot sl"></i>Solicitud</span><span><i class="dot cb"></i>Cambio</span></div>
        </div>
      </div>
      <div id="viewQuien" hidden>
        <div class="cal-header">
          <button class="nav-btn" id="qPrev" aria-label="Día anterior">‹</button>
          <div id="qLabel"></div>
          <button class="nav-btn" id="qNext" aria-label="Día siguiente">›</button>
        </div>
        <input type="date" id="qFecha" aria-label="Ir a una fecha">
        <button class="btn-sec" id="qHoy" hidden>Volver a hoy</button>
        <div id="listaQuien"></div>
        <label>Días siguientes</label>
        <div id="proxQuien"></div>
      </div>
      <div id="viewChat" hidden>
        <div id="chatMsgs"></div>
        <div class="chat-form">
          <input id="chatTxt" maxlength="500" placeholder="Escribe un mensaje..." autocomplete="off" aria-label="Mensaje">
          <button class="btn-chat" id="chatEnviar" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
        </div>
      </div>
      <div id="viewSol" hidden></div>
      <div id="viewAus" hidden>
        <div class="cal-card">
          <label for="ausTipo">Registrar mi ausencia</label>
          <select id="ausTipo"></select>
          <label for="ausDesde">Desde</label><input type="date" id="ausDesde">
          <label for="ausHasta">Hasta</label><input type="date" id="ausHasta">
          <button class="btn-sync" id="btnAus">Registrar</button>
        </div>
        <div id="listaAus"></div>
      </div>
      <div id="viewEq" hidden></div>
    </main>

    <nav class="tabs" aria-label="Secciones">
      <button data-tab="cal" class="on"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><span>Calendario</span></button>
      <button data-tab="quien"><span class="ic"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><span>Quién</span></button>
      <button data-tab="chat"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5h.5A8.5 8.5 0 0 1 21 11z"/></svg><span id="badgeChat" class="bdg"></span></span><span>Chat</span></button>
      <button data-tab="sol"><span class="ic"><svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span id="badge" class="bdg"></span></span><span>Cambios</span></button>
      <button data-tab="aus"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span>Ausencias</span></button>
      <button data-tab="eq" id="tabEq" hidden><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span><span>Equipo</span></button>
    </nav>
  </div>
  <div id="ver"></div>
</div>

<div id="modal" class="modal" hidden><div class="modal-body" id="modalBody"></div></div>
<script type="module" src="app.js?v=13"></script>
</body>
</html>
